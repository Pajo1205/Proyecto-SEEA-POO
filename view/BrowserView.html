<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema SEEA</title>
    <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body>

    <main class="min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="menu-card">

            <h1 class="text-center mb-4">Sistema SEEA</h1>

            <p id="mensaje" class="text-center"></p>

            <div id="menu-principal" class="seccion">
                <h2 class="text-center mb-4">Menu</h2>
                <div class="d-grid gap-3">
                    <button type="button" class="btn btn-primary btn-lg" id="ir-colegios">
                        1) Colegios
                    </button>
                    <button type="button" class="btn btn-primary btn-lg" id="ir-horarios">
                        2) Horarios
                    </button>
                    <button type="button" class="btn btn-primary btn-lg" id="ir-solicitudes">
                        3) Solicitudes
                    </button>
                </div>
            </div>

            <div id="menu-colegios" class="seccion" hidden>
                <h2 class="text-center mb-4">Colegios</h2>
                <div class="d-grid gap-3">
                    <button type="button" class="btn btn-primary" id="ir-crear-colegio">
                        Crear colegio
                    </button>
                    <button type="button" class="btn btn-secondary" id="ir-ver-colegios">
                        Ver colegios
                    </button>
                    <button type="button" class="btn btn-danger" id="ir-eliminar-colegios">
                        Eliminar colegio
                    </button>
                    <button type="button" class="btn btn-outline-secondary volver-principal">
                        Volver al menu
                    </button>
                </div>
            </div>

            <div id="crear-colegio" class="seccion" hidden>
                <h2 class="text-center mb-4">Crear colegio</h2>
                <form id="form-colegio">
                    <div class="mb-3">
                        <label for="colegio-nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="colegio-nombre" name="nombre">
                    </div>
                    <div class="mb-3">
                        <label for="colegio-direccion" class="form-label">Direccion:</label>
                        <input type="text" class="form-control" id="colegio-direccion" name="direccion">
                    </div>
                    <div class="mb-3">
                        <label for="colegio-telefono" class="form-label">Telefono:</label>
                        <input type="text" class="form-control" id="colegio-telefono" name="telefono">
                    </div>
                    <div class="mb-3">
                        <label for="colegio-correo" class="form-label">Correo:</label>
                        <input type="email" class="form-control" id="colegio-correo" name="correo">
                    </div>
                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="colegio-aliado" name="aliado">
                        <label class="form-check-label" for="colegio-aliado">Aliado</label>
                    </div>
                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-success">
                            Guardar colegio
                        </button>
                        <button type="button" class="btn btn-outline-secondary volver-colegios">
                            Volver
                        </button>
                    </div>
                </form>
            </div>

            <div id="ver-colegios" class="seccion" hidden>
                <h2 class="text-center mb-4">Ver colegios</h2>
                <ul class="list-group" id="datos-colegios"></ul>
                <button type="button" class="btn btn-outline-secondary volver-colegios mt-3">
                    Volver
                </button>
            </div>

            <div id="eliminar-colegios" class="seccion" hidden>
                <h2 class="text-center mb-4">Eliminar colegio</h2>
                <ul class="list-group mb-3" id="lista-eliminar-colegios"></ul>
                <button type="button" class="btn btn-outline-secondary volver-colegios">
                    Volver
                </button>
            </div>

            <div id="menu-horarios" class="seccion" hidden>
                <h2 class="text-center mb-4">Horarios</h2>
                <div class="d-grid gap-3">
                    <button type="button" class="btn btn-primary" id="ir-crear-horario">
                        Crear horario
                    </button>
                    <button type="button" class="btn btn-secondary" id="ir-ver-horarios">
                        Ver horarios
                    </button>
                    <button type="button" class="btn btn-danger" id="ir-eliminar-horarios">
                        Eliminar horario
                    </button>
                    <button type="button" class="btn btn-outline-secondary volver-principal">
                        Volver al menu
                    </button>
                </div>
            </div>

            <div id="crear-horario" class="seccion" hidden>
                <h2 class="text-center mb-4">Crear horario</h2>
                <form id="form-horario">
                    <div class="mb-3">
                        <label for="horario-fecha" class="form-label">Fecha (YYYY-MM-DD):</label>
                        <input type="date" class="form-control" id="horario-fecha" name="fecha">
                    </div>
                    <div class="mb-3">
                        <label for="horario-inicio" class="form-label">Hora inicio (HH:MM):</label>
                        <input type="time" class="form-control" id="horario-inicio" name="horaInicio">
                    </div>
                    <div class="mb-4">
                        <label for="horario-fin" class="form-label">Hora fin (HH:MM):</label>
                        <input type="time" class="form-control" id="horario-fin" name="horaFin">
                    </div>
                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-success">
                            Guardar horario
                        </button>
                        <button type="button" class="btn btn-outline-secondary volver-horarios">
                            Volver
                        </button>
                    </div>
                </form>
            </div>

            <div id="ver-horarios" class="seccion" hidden>
                <h2 class="text-center mb-4">Ver horarios</h2>
                <ul class="list-group" id="datos-horarios"></ul>
                <button type="button" class="btn btn-outline-secondary volver-horarios mt-3">
                    Volver
                </button>
            </div>

            <div id="eliminar-horarios" class="seccion" hidden>
                <h2 class="text-center mb-4">Eliminar horario</h2>
                <ul class="list-group mb-3" id="lista-eliminar-horarios"></ul>
                <button type="button" class="btn btn-outline-secondary volver-horarios">
                    Volver
                </button>
            </div>

            <div id="menu-solicitudes" class="seccion" hidden>
                <h2 class="text-center mb-4">Solicitudes</h2>
                <div class="d-grid gap-3">
                    <button type="button" class="btn btn-primary" id="ir-crear-solicitud">
                        Crear solicitud
                    </button>
                    <button type="button" class="btn btn-secondary" id="ir-gestionar-solicitudes">
                        Gestionar solicitudes
                    </button>
                    <button type="button" class="btn btn-danger" id="ir-eliminar-solicitudes">
                        Eliminar solicitud
                    </button>
                    <button type="button" class="btn btn-outline-secondary volver-principal">
                        Volver al menu
                    </button>
                </div>
            </div>

            <div id="crear-solicitud" class="seccion" hidden>
                <h2 class="text-center mb-4">Crear solicitud</h2>
                <form id="form-solicitud">
                    <div class="mb-3">
                        <label for="solicitud-colegio" class="form-label">ID colegio:</label>
                        <input type="number" class="form-control" id="solicitud-colegio" name="idColegio">
                    </div>
                    <div class="mb-3">
                        <label for="solicitud-horario" class="form-label">ID horario:</label>
                        <input type="number" class="form-control" id="solicitud-horario" name="idHorario">
                    </div>
                    <div class="mb-3">
                        <label for="solicitud-estudiantes" class="form-label">Cantidad estudiantes:</label>
                        <input type="number" class="form-control" id="solicitud-estudiantes" name="cantidadEstudiantes">
                    </div>
                    <div class="mb-3">
                        <label for="solicitud-profesores" class="form-label">Cantidad profesores:</label>
                        <input type="number" class="form-control" id="solicitud-profesores" name="cantidadProfesores">
                    </div>
                    <div class="mb-3">
                        <label for="solicitud-grado" class="form-label">Grado:</label>
                        <input type="text" class="form-control" id="solicitud-grado" name="grado">
                    </div>
                    <div class="mb-3">
                        <label for="solicitud-transporte" class="form-label">Transporte:</label>
                        <input type="text" class="form-control" id="solicitud-transporte" name="transporte">
                    </div>
                    <div class="form-check mb-2">
                        <input type="checkbox" class="form-check-input" id="solicitud-tour" name="solicitaTour">
                        <label class="form-check-label" for="solicitud-tour">Tour</label>
                    </div>
                    <div class="form-check mb-2">
                        <input type="checkbox" class="form-check-input" id="solicitud-charla" name="solicitaCharla">
                        <label class="form-check-label" for="solicitud-charla">Charla</label>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="solicitud-taller" name="solicitaTaller">
                        <label class="form-check-label" for="solicitud-taller">Taller</label>
                    </div>
                    <div class="mb-4">
                        <label for="solicitud-observaciones" class="form-label">Observaciones:</label>
                        <textarea class="form-control" id="solicitud-observaciones" name="observaciones"></textarea>
                    </div>
                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-success">
                            Guardar solicitud
                        </button>
                        <button type="button" class="btn btn-outline-secondary volver-solicitudes">
                            Volver
                        </button>
                    </div>
                </form>
            </div>

            <div id="gestionar-solicitudes" class="seccion" hidden>
                <h2 class="text-center mb-4">Gestionar solicitudes</h2>
                <ul class="list-group mb-3" id="datos-solicitudes"></ul>

                <button type="button" class="btn btn-outline-secondary volver-solicitudes">
                    Volver
                </button>
            </div>

            <div id="eliminar-solicitudes" class="seccion" hidden>
                <h2 class="text-center mb-4">Eliminar solicitud</h2>
                <ul class="list-group mb-3" id="lista-eliminar-solicitudes"></ul>
                <button type="button" class="btn btn-outline-secondary volver-solicitudes">
                    Volver
                </button>
            </div>

        </div>
    </main>

    <script src="/BrowserView.js"></script>

</body>
</html>
