<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema SEEA</title>
</head>
<body>

    <h1>Sistema SEEA</h1>

    <h2>Menu</h2>
    <ul>
        <li><a href="#crear-colegio">1) Crear colegio</a></li>
        <li><a href="#crear-horario">2) Crear horario</a></li>
        <li><a href="#crear-solicitud">3) Crear solicitud</a></li>
        <li><a href="#ver-datos">4) Ver datos</a></li>
    </ul>

    <p id="mensaje"></p>

    <hr>

    <h2 id="crear-colegio">1) Crear colegio</h2>
    <form id="form-colegio">
        <p>
            <label for="colegio-nombre">Nombre:</label>
            <input type="text" id="colegio-nombre" name="nombre">
        </p>
        <p>
            <label for="colegio-direccion">Direccion:</label>
            <input type="text" id="colegio-direccion" name="direccion">
        </p>
        <p>
            <label for="colegio-telefono">Telefono:</label>
            <input type="text" id="colegio-telefono" name="telefono">
        </p>
        <p>
            <label for="colegio-correo">Correo:</label>
            <input type="email" id="colegio-correo" name="correo">
        </p>
        <p>
            <label for="colegio-aliado">Aliado:</label>
            <input type="checkbox" id="colegio-aliado" name="aliado">
        </p>
        <p>
            <button type="submit">Guardar colegio</button>
        </p>
    </form>

    <hr>

    <h2 id="crear-horario">2) Crear horario</h2>
    <form id="form-horario">
        <p>
            <label for="horario-fecha">Fecha (YYYY-MM-DD):</label>
            <input type="date" id="horario-fecha" name="fecha">
        </p>
        <p>
            <label for="horario-inicio">Hora inicio (HH:MM):</label>
            <input type="time" id="horario-inicio" name="horaInicio">
        </p>
        <p>
            <label for="horario-fin">Hora fin (HH:MM):</label>
            <input type="time" id="horario-fin" name="horaFin">
        </p>
        <p>
            <button type="submit">Guardar horario</button>
        </p>
    </form>

    <hr>

    <h2 id="crear-solicitud">3) Crear solicitud</h2>
    <form id="form-solicitud">
        <p>
            <label for="solicitud-colegio">ID colegio:</label>
            <input type="number" id="solicitud-colegio" name="idColegio">
        </p>
        <p>
            <label for="solicitud-horario">ID horario:</label>
            <input type="number" id="solicitud-horario" name="idHorario">
        </p>
        <p>
            <label for="solicitud-estudiantes">Cantidad estudiantes:</label>
            <input type="number" id="solicitud-estudiantes" name="cantidadEstudiantes">
        </p>
        <p>
            <label for="solicitud-profesores">Cantidad profesores:</label>
            <input type="number" id="solicitud-profesores" name="cantidadProfesores">
        </p>
        <p>
            <label for="solicitud-grado">Grado:</label>
            <input type="text" id="solicitud-grado" name="grado">
        </p>
        <p>
            <label for="solicitud-transporte">Transporte:</label>
            <input type="text" id="solicitud-transporte" name="transporte">
        </p>
        <p>
            <label for="solicitud-tour">Tour:</label>
            <input type="checkbox" id="solicitud-tour" name="solicitaTour">
        </p>
        <p>
            <label for="solicitud-charla">Charla:</label>
            <input type="checkbox" id="solicitud-charla" name="solicitaCharla">
        </p>
        <p>
            <label for="solicitud-taller">Taller:</label>
            <input type="checkbox" id="solicitud-taller" name="solicitaTaller">
        </p>
        <p>
            <label for="solicitud-observaciones">Observaciones:</label>
            <textarea id="solicitud-observaciones" name="observaciones"></textarea>
        </p>
        <p>
            <button type="submit">Guardar solicitud</button>
        </p>
    </form>

    <hr>

    <h2 id="ver-datos">4) Ver datos</h2>

    <h3>Colegios</h3>
    <pre id="datos-colegios"></pre>

    <h3>Horarios</h3>
    <pre id="datos-horarios"></pre>

    <h3>Solicitudes</h3>
    <pre id="datos-solicitudes"></pre>

    <h3>Acciones de solicitudes</h3>
    <div id="acciones-solicitudes"></div>

    <script>
        function mensaje(texto) {
            document.getElementById("mensaje").textContent = texto;
        }

        async function enviar(url, datos) {
            const respuesta = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });

            const resultado = await respuesta.json();
            mensaje(resultado.mensaje || "listo");

            await cargarDatos();
        }

        async function cargarDatos() {
            const colegios = await fetch("/colegios").then(r => r.json());
            const horarios = await fetch("/horarios").then(r => r.json());
            const solicitudes = await fetch("/solicitudes").then(r => r.json());

            document.getElementById("datos-colegios").textContent =
                JSON.stringify(colegios, null, 2);
            document.getElementById("datos-horarios").textContent =
                JSON.stringify(horarios, null, 2);
            document.getElementById("datos-solicitudes").textContent =
                JSON.stringify(solicitudes, null, 2);

            dibujarAcciones(solicitudes);
        }

        function dibujarAcciones(solicitudes) {
            const contenedor = document.getElementById("acciones-solicitudes");
            contenedor.innerHTML = "";

            if (solicitudes.length === 0) {
                contenedor.textContent = "no hay solicitudes";
                return;
            }

            solicitudes.forEach(solicitud => {
                const linea = document.createElement("p");
                linea.textContent = `Solicitud #${solicitud.id} (${solicitud.estado}) `;

                if (solicitud.estado === "PENDIENTE") {
                    linea.appendChild(botonAccion(solicitud.id, "aprobar"));
                    linea.appendChild(botonAccion(solicitud.id, "rechazar"));
                }

                if (solicitud.estado !== "CANCELADA" &&
                    solicitud.estado !== "RECHAZADA" &&
                    solicitud.estado !== "FINALIZADA") {
                    linea.appendChild(botonAccion(solicitud.id, "cancelar"));
                }

                contenedor.appendChild(linea);
            });
        }

        function botonAccion(id, accion) {
            const boton = document.createElement("button");
            boton.textContent = accion;
            boton.addEventListener("click", () => ejecutarAccion(id, accion));
            return boton;
        }

        async function ejecutarAccion(id, accion) {
            const respuesta = await fetch(
                `/solicitudes/${id}/${accion}`,
                { method: "PATCH" }
            );

            const resultado = await respuesta.json();
            mensaje(resultado.mensaje || "listo");

            await cargarDatos();
        }

        document.getElementById("form-colegio")
            .addEventListener("submit", async evento => {
                evento.preventDefault();
                await enviar("/colegios", {
                    nombre: document.getElementById("colegio-nombre").value,
                    direccion: document.getElementById("colegio-direccion").value,
                    telefono: document.getElementById("colegio-telefono").value,
                    correo: document.getElementById("colegio-correo").value,
                    aliado: document.getElementById("colegio-aliado").checked
                });
            });

        document.getElementById("form-horario")
            .addEventListener("submit", async evento => {
                evento.preventDefault();
                await enviar("/horarios", {
                    fecha: document.getElementById("horario-fecha").value,
                    horaInicio: document.getElementById("horario-inicio").value,
                    horaFin: document.getElementById("horario-fin").value
                });
            });

        document.getElementById("form-solicitud")
            .addEventListener("submit", async evento => {
                evento.preventDefault();
                await enviar("/solicitudes", {
                    idColegio: Number(document.getElementById("solicitud-colegio").value),
                    idHorario: Number(document.getElementById("solicitud-horario").value),
                    cantidadEstudiantes: Number(document.getElementById("solicitud-estudiantes").value),
                    cantidadProfesores: Number(document.getElementById("solicitud-profesores").value),
                    grado: document.getElementById("solicitud-grado").value,
                    transporte: document.getElementById("solicitud-transporte").value,
                    solicitaTour: document.getElementById("solicitud-tour").checked,
                    solicitaCharla: document.getElementById("solicitud-charla").checked,
                    solicitaTaller: document.getElementById("solicitud-taller").checked,
                    observaciones: document.getElementById("solicitud-observaciones").value
                });
            });

        cargarDatos();
    </script>

</body>
</html>
