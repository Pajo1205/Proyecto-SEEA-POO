
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar Sesión | SEEA - UVG</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body class="login-page">

    <main class="login-card">

        <header>

            <div class="brand-mark">
                UVG <span>SEEA</span>
            </div>

            <p class="eyebrow">
                Sistema de Experiencias Educativas
            </p>

            <h1>Bienvenido</h1>

            <p>
                Iniciá sesión para acceder
                a tu portal.
            </p>

        </header>

        <!-- INICIO DE SESION -->

        <form id="login-form">

            <label for="correo">
                Correo electrónico

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    autocomplete="username"
                    required
                >
            </label>

            <label for="contrasena">
                Contraseña

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Ingresá tu contraseña"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button
                type="submit"
                class="primary"
            >
                Ingresar
            </button>

        </form>

        <div
            id="aviso"
            role="status"
            aria-live="polite"
        ></div>

        <!-- REGISTRO -->

        <footer>

            <p class="small">
                ¿No tenés una cuenta?
                <a href="/registro">
                    Registrate aquí
                </a>.
            </p>

        </footer>

    </main>

    <script
        src="/login.js"
        defer
    ></script>

</body>
</html>
