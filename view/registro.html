
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta | SEEA UVG</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body class="login-page">

    <main class="login-card registro-card">

        <!-- LOGOTIPO -->

        <header class="registro-header">

            <div class="brand-mark">
                UVG <span>SEEA</span>
            </div>

            <p class="eyebrow">
                Sistema de Experiencias Educativas
            </p>

            <h1>Crear nueva cuenta</h1>

            <p>
                Registrate para participar en
                las experiencias educativas de UVG.
            </p>

        </header>

        <!-- SELECCIONAR TIPO DE USUARIO -->

        <section id="seleccion-tipo">

            <h2>¿Qué tipo de usuario sos?</h2>

            <div class="registro-opciones">

                <button
                    type="button"
                    class="registro-opcion"
                    data-tipo="COLEGIO"
                >
                    <span class="registro-icono">🏫</span>

                    <strong>Usuario de colegio</strong>

                    <small>
                        Solicitá visitas educativas
                        para tu institución.
                    </small>
                </button>

                <button
                    type="button"
                    class="registro-opcion"
                    data-tipo="VOLUNTARIO"
                >
                    <span class="registro-icono">🎓</span>

                    <strong>Voluntario UVG</strong>

                    <small>
                        Registrá tu disponibilidad
                        y participá en visitas.
                    </small>
                </button>

            </div>

        </section>

        <!-- FORMULARIO DE REGISTRO -->

        <section id="seccion-formulario" hidden>

            <button
                type="button"
                id="volver-tipo"
                class="secondary"
            >
                ← Cambiar tipo de usuario
            </button>

            <h2 id="titulo-registro"></h2>

            <form id="registro-form">

                <input
                    type="hidden"
                    name="tipo"
                >

                <!-- DATOS GENERALES -->

                <label>
                    Nombre completo

                    <input
                        type="text"
                        name="nombre"
                        maxlength="120"
                        autocomplete="name"
                        required
                    >
                </label>

                <label>
                    Correo electrónico

                    <input
                        type="email"
                        name="correo"
                        id="correo-registro"
                        autocomplete="email"
                        required
                    >
                </label>

                <!-- USUARIO DE COLEGIO -->

                <div id="campos-colegio" hidden>

                    <label>
                        Teléfono

                        <input
                            type="tel"
                            name="telefono"
                            maxlength="30"
                        >
                    </label>

                    <label>
                        Colegio al que pertenecés

                        <select
                            name="idColegio"
                            id="idColegio"
                        >
                            <option value="">
                                Seleccionar colegio
                            </option>
                        </select>
                    </label>

                    <p
                        id="direccion-colegio"
                        class="hint"
                    ></p>

                    <!-- OTRO COLEGIO -->

                    <div id="campos-otro-colegio" hidden>

                        <p class="hint">
                            Si tu colegio no aparece,
                            ingresá sus datos.
                            Se registrará como
                            colegio no aliado.
                        </p>

                        <label>
                            Nombre del colegio

                            <input
                                type="text"
                                name="nombreColegio"
                                maxlength="150"
                            >
                        </label>

                        <label>
                            Dirección del colegio

                            <input
                                type="text"
                                name="direccionColegio"
                                maxlength="250"
                            >
                        </label>

                    </div>

                </div>

                <!-- VOLUNTARIO -->

                <div id="campos-voluntario" hidden>

                    <label>
                        Carnet universitario

                        <input
                            type="text"
                            name="carnet"
                            maxlength="30"
                        >
                    </label>

                    <label>
                        Carrera universitaria

                        <select
                            name="carrera"
                            id="carrera"
                        >
                            <option value="">
                                Seleccionar carrera
                            </option>
                        </select>
                    </label>

                    <div id="campo-otra-carrera" hidden>

                        <label>
                            Especificá tu carrera

                            <input
                                type="text"
                                name="otraCarrera"
                                maxlength="120"
                            >
                        </label>

                    </div>

                </div>

                <!-- CONTRASEÑAS -->

                <label>
                    Contraseña

                    <input
                        type="password"
                        name="contrasena"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <label>
                    Confirmar contraseña

                    <input
                        type="password"
                        name="confirmarContrasena"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <button
                    type="submit"
                    class="primary registro-enviar"
                >
                    Crear cuenta
                </button>

            </form>

        </section>

        <!-- MENSAJES -->

        <div
            id="aviso"
            role="status"
            aria-live="polite"
        ></div>

        <!-- INICIO DE SESION -->

        <footer class="registro-footer">

            <p>
                ¿Ya tenés una cuenta?
                <a href="/">Iniciar sesión</a>
            </p>

        </footer>

    </main>

    <script src="/registro.js" defer></script>

</body>
</html>
